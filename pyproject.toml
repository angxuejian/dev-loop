[project]
name = "dev-loop"
version = "1.0.0"
description = "An AI-powered development loop that plans, implements, tests, reviews, and iteratively fixes code until it's ready for human approval."
readme = "README.md"
authors = [
    { name = "angxuejian", email = "xuejian.ang@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dev-loop = "dev_loop:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.5",
]
