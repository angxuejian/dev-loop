
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  
permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          pip install -r src/scripts/requirements/code-review.txt

      # - name: Run Codex review
      #   uses: openai/codex-action@v1
      #   with:
      #     openai-api-key: ${{ secrets.GLM_LLM_API_KEY }}
      #     responses-api-endpoint: ${{ vars.LLM_BASE_URL }}/responses

      - name: Test SiliconFlow connection
        run: |
          curl -v --connect-timeout 10 https://api.siliconflow.cn/v1/models
          
      - name: Run AI Code review
        env:
          LLM_API_KEY: ${{ secrets.GLM_LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python src/scripts/code-review.py
